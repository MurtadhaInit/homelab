---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 12h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: 2 # Default number of replicas for volumes created using the Longhorn UI
      # Stale replica dirs left behind by replica rebuilds and deleted volumes still
      # count against the disk, and quietly starve it until new replicas can't schedule.
      # Longhorn only reports them (Settings -> Advanced -> Orphan Resources) unless told to clean up.
      orphanResourceAutoDeletion: replica-data;instance
      # Requests track typical (1-day average) usage so the scheduler accounts for these
      # pods. Instance-manager memory has no knob: it scales with the volumes it serves.
      systemManagedCSIComponentsResourceLimits: >-
        {
          "csi-attacher": {"requests": {"cpu": "5m", "memory": "16Mi"}},
          "csi-provisioner": {"requests": {"cpu": "5m", "memory": "16Mi"}},
          "csi-resizer": {"requests": {"cpu": "5m", "memory": "16Mi"}},
          "csi-snapshotter": {"requests": {"cpu": "5m", "memory": "16Mi"}},
          "longhorn-csi-plugin": {"requests": {"cpu": "5m", "memory": "24Mi"}},
          "node-driver-registrar": {"requests": {"cpu": "5m", "memory": "8Mi"}},
          "longhorn-liveness-probe": {"requests": {"cpu": "5m", "memory": "16Mi"}}
        }
    longhornManager:
      resources:
        requests:
          cpu: 25m
          memory: 160Mi
    persistence:
      defaultClassReplicaCount: 2 # Replica count of the default Longhorn StorageClass
      # reclaimPolicy: Retain
    # metrics:
    #   serviceMonitor:
    #     enabled: true # create a Prometheus ServiceMonitor resource for Longhorn Manager components
    #     # -- Additional labels for the Prometheus ServiceMonitor resource.
    #     additionalLabels: {}
    #     # ...see other options
    httproute:
      enabled: true
      parentRefs:
        - name: homelab
          namespace: gateway-system
          sectionName: https
      hostnames:
        - longhorn.k8s.murtadha.dev
