apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: https
  hostnames:
    - flux.k8s.murtadha.dev
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
---
# Cilium's gateway proxy (cilium-envoy) tags upstream connections with the
# reserved `ingress` identity rather than the host/remote-node of the node
# it runs on. Standard NetworkPolicy `namespaceSelector` rules don't match
# this — neither does the chart-shipped flux-operator-web policy — so
# gateway traffic to port 9080 is policy-denied at the backend pod's BPF
# program, surfacing as a 503 "connection timeout" at the Envoy upstream.
# A CiliumNetworkPolicy with fromEntities=ingress is required.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-flux-web
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
