apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: https
  hostnames:
    - flux.k8s.murtadha.dev
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
