---
# Without this, files deleted inside a volume stay allocated in its replicas (including in
# system snapshots Longhorn hasn't merged yet). Freeing them lets the node's own trim
# (e.g. Talos FilesystemTrimConfig) hand the space back to the Proxmox thin pool.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim
  namespace: longhorn-system
spec:
  name: filesystem-trim
  task: filesystem-trim
  cron: "0 4 * * *"
  groups:
    - default # the "default" group covers every volume without its own recurring jobs
  concurrency: 1
