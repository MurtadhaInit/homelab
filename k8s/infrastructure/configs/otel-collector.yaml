apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: monitoring
---
# Read-only access for the k8s_attributes processor to look up pod metadata.
# Kept explicit here rather than letting the operator generate RBAC, which
# would require granting the operator rights to create arbitrary ClusterRoles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: monitoring
---
# Node-level agent: tails every pod's log files on its node and enriches them
# with Kubernetes metadata.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: monitoring
spec:
  mode: daemonset
  serviceAccount: otel-agent
  # Log agents must run everywhere including control-plane nodes
  tolerations:
    - operator: Exists
  # Pod log files are root-owned and not world-readable
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  env:
    # Used by the agent (`k8s_attributes` processor) to only watch pods on its own node.
    # Each agent only ever sees its own node's logs, so tracking the whole cluster would
    # waste memory and load the API server for nothing.
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    # Persists file read offsets so restarts neither drop nor re-send logs
    - name: storage
      hostPath:
        path: /var/lib/otelcol
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: storage
      mountPath: /var/lib/otelcol
  observability:
    metrics:
      enableMetrics: true
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol # save offsets as files here

    receivers:
      file_log:
        include: [/var/log/pods/*/*/*.log]
        # Skip the agent's own logs to avoid a feedback loop
        exclude:
          [
            /var/log/pods/monitoring_otel-agent-collector-*_*/otc-container/*.log,
          ]
        # With offsets persisted, this only applies to files never seen before
        # (e.g. pods that started while the agent was down)
        start_at: beginning
        include_file_path: true
        storage: file_storage
        operators:
          # Parses the CRI log format and sets pod/namespace/container
          # resource attributes from the file path
          - type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8s_attributes:
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - service.name
      batch: {}

    exporters:
      debug:
        verbosity: basic

    service:
      extensions: [file_storage]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [file_log]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [debug]
