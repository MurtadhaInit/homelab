apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
spec:
  distribution:
    # Auto-upgrade within 2.x; pin tighter (e.g. "2.7.x") to slow upgrades.
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    multitenant: false
    networkPolicy: true
  sync:
    kind: GitRepository
    url: "https://github.com/MurtadhaInit/homelab.git"
    ref: "refs/heads/main"
    path: "k8s/clusters/homelab"
    interval: "1m"
    # No pullSecret — public repo, anonymous HTTPS clone.
