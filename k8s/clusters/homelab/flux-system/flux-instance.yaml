apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Patch-only auto-upgrades. Crossing a minor boundary unattended while the
    # operator stays pinned in Terraform could result in incompatibility and
    # stall this instance.
    # Bump the minor here together with operator_chart.version in flux.tf.
    version: "2.9.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    multitenant: false
    networkPolicy: true
  sync:
    kind: GitRepository
    url: "https://github.com/MurtadhaInit/homelab.git"
    ref: "refs/heads/main"
    path: "k8s/clusters/homelab"
    interval: "1m"
    # public repo so no pullSecret (anonymous HTTPS clone)
