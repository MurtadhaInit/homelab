---
apiVersion: v1
kind: Namespace
metadata:
  name: qui
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qui-config
data:
  TZ: Asia/Amman
  # qui only binds 0.0.0.0 when its container detection fires; set it outright
  # rather than depend on that heuristic under containerd.
  QUI__HOST: 0.0.0.0
  QUI__PORT: "7476"
  # Upstream defaults to DEBUG.
  QUI__LOG_LEVEL: INFO
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qui-config-pvc
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qui
  name: qui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qui
    spec:
      # fsGroup is what makes the Longhorn volume writable: the image only
      # chowns /config on its PUID/PGID path, which we bypass by setting the
      # runtime user here instead.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:v1.26.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 7476
          volumeMounts:
            - name: config
              mountPath: /config
          envFrom:
            - configMapRef:
                name: qui-config
            - secretRef:
                name: qui-session
          startupProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qui-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: qui
  name: qui
spec:
  type: ClusterIP
  selector:
    app: qui
  ports:
    - name: http
      port: 7476
      protocol: TCP
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qui
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: https
  hostnames:
    - qui.k8s.murtadha.dev
  rules:
    - backendRefs:
        - name: qui
          port: 7476
