---
apiVersion: v1
kind: Namespace
metadata:
  name: qui
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qui-config
data:
  TZ: Asia/Amman
  # qui only binds 0.0.0.0 when its container detection fires; set it outright
  # rather than depend on that heuristic under containerd.
  QUI__HOST: 0.0.0.0
  QUI__PORT: "7476"
  QUI__LOG_LEVEL: INFO # Upstream defaults to DEBUG.
  # Blocks DNS rebinding: reject requests addressed to any other host name.
  # Probes send `Host: localhost` (always allowed) since kubelet would otherwise
  # use the pod IP for the Host header (not in this allowed list).
  QUI__ALLOWED_HOSTS: qui.k8s.murtadha.dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qui-config-pvc
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qui
  name: qui
  annotations:
    ignore-check.kube-linter.io/non-isolated-pod: "isolated by CiliumNetworkPolicy"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qui
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API.
      # Running as a fixed UID skips the image's PUID/PGID chown of /config,
      # so fsGroup is what makes the Longhorn volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:v1.35.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 7476
          volumeMounts:
            - name: config
              mountPath: /config
          envFrom:
            - configMapRef:
                name: qui-config
            - secretRef:
                name: qui-session
          startupProbe:
            httpGet:
              path: /healthz/readiness
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qui-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: qui
  name: qui
spec:
  type: ClusterIP
  selector:
    app: qui
  ports:
    - name: http
      port: 7476
      protocol: TCP
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qui
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: https
  hostnames:
    - qui.k8s.murtadha.dev
  rules:
    - backendRefs:
        - name: qui
          port: 7476
---
# Only the gateway reaches Qui. Cilium tags gateway traffic with the `ingress` identity,
# hence a CiliumNetworkPolicy to utilise fromEntities. Egress stays open.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qui
spec:
  endpointSelector:
    matchLabels:
      app: qui
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: http
              protocol: TCP
