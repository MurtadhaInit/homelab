# MySQL accepts connections from the backend only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: e-store-backend
      ports:
        - port: mysql
          protocol: TCP
---
# The backend isn't exposed outside the cluster, so only pods in its own namespace reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e-store-backend
spec:
  podSelector:
    matchLabels:
      app: e-store-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
