apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-config
data:
  MEILI_ADDR: http://karakeep-meilisearch:7700
  BROWSER_WEB_URL: http://karakeep-chrome:9222
  DATA_DIR: /data
  AUTH_TRUSTED_ORIGINS: "" # limit sign-ins to NEXTAUTH_URL only
  NEXTAUTH_URL: https://karakeep.k8s.murtadha.dev
  DB_WAL_MODE: "true" # possible because the PV is on block storage (not NFS)
  # Raised from the defaults (navigate 30, screenshot 5, job 60): JS-heavy pages miss them.
  # The job timeout must cover navigate + screenshot + challenge wait (15) + parsing (60).
  CRAWLER_NAVIGATE_TIMEOUT_SEC: "60" # for loading the page (including redirects)
  CRAWLER_SCREENSHOT_TIMEOUT_SEC: "15" # for taking the viewport screenshot
  CRAWLER_JOB_TIMEOUT_SEC: "150" # the whole crawl job, from start to finish
  # Match the home IP's location: bot checks flag a browser whose timezone doesn't match its IP
  CRAWLER_BROWSER_TIMEZONE: Asia/Amman
  # LLM provider for tagging and summarisation
  OPENAI_BASE_URL: https://openrouter.ai/api/v1
  INFERENCE_CONTEXT_LENGTH: "16384"
  # The model used for each purpose
  INFERENCE_TEXT_MODEL: openai/gpt-6-luna
  INFERENCE_IMAGE_MODEL: openai/gpt-6-luna
  OPENAI_REASONING_EFFORT: none
  EMBEDDING_ENABLE_AUTO_INDEXING: "true"
  EMBEDDING_TEXT_MODEL: openai/text-embedding-3-small
  EMBEDDING_DIMENSIONS: "1536" # must match the model
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data-pvc
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: karakeep-web
  name: karakeep-web
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: karakeep-web
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # faster pod restarts: check only the top directory of the volume for the right
        # group and permissions on volume mounts.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: karakeep-web
          image: ghcr.io/karakeep-app/karakeep:0.34.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: karakeep-config
            - secretRef:
                name: karakeep-secrets
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1Gi # shared by the web server and the crawl/inference workers
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: karakeep-web
  name: karakeep-web
spec:
  type: ClusterIP
  selector:
    app: karakeep-web
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karakeep-web
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: https
  hostnames:
    - karakeep.k8s.murtadha.dev
  rules:
    - backendRefs:
        - name: karakeep-web
          port: 3000
