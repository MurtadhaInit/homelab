apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: karakeep-mcp
  name: karakeep-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-mcp
  template:
    metadata:
      labels:
        app: karakeep-mcp
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API.
      securityContext:
        runAsNonRoot: true
        # Both images default to root; 1000 is the `node` user they share.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The MCP server only speaks stdio, so supergateway has to spawn it as its own child
      # process (stdio can't cross containers). The server ships as a single bundled JS file,
      # so an init container copies it into a shared volume for supergateway's Node to run.
      initContainers:
        - name: copy-mcp-server
          image: ghcr.io/karakeep-app/karakeep-mcp:0.33.2
          command:
            - cp
            - /app/apps/mcp/index.js
            - /mcp/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mcp-server
              mountPath: /mcp
      containers:
        - name: supergateway
          image: ghcr.io/supercorp-ai/supergateway:4.0.0
          args:
            - --stdio
            - node /mcp/index.js
            - --outputTransport
            - streamableHttp
            - --port
            - "8000"
            - --logLevel
            - none
          env:
            - name: KARAKEEP_API_ADDR
              value: http://karakeep-web:3000
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: KARAKEEP_API_KEY
                  # Don't block the mcp server deployment because of a missing API key.
                  # Generate the API key from the Karakeep UI once Karakeep itself is deployed.
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: mcp-server
              mountPath: /mcp
              readOnly: true
          # supergateway only offers a health endpoint in its SSE/WS modes.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mcp-server
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: karakeep-mcp
  name: karakeep-mcp
spec:
  type: ClusterIP
  selector:
    app: karakeep-mcp
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: http
