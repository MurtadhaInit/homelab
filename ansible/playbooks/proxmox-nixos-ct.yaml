---
# API tokens can't set certain things on privileged containers (only root@pam *password* auth can),
# so we perform those tasks imperatively here following the initial LXC creation with Terraform.
# These tasks include feature flags (for nesting), device passthrough (for TUN), and bind mounts.
- name: Configure NixOS LXC container on Proxmox (imperative tasks on privileged LXCs, not possible via Proxmox API)
  hosts: pve-host-1
  remote_user: root

  vars:
    nixos_ct_id: 1000

  tasks:
    - name: Check if NixOS container exists
      ansible.builtin.command: pct status {{ nixos_ct_id }}
      register: ct_status
      changed_when: false
      failed_when: false

    - name: Get current container config
      ansible.builtin.command: pct config {{ nixos_ct_id }}
      register: ct_config
      changed_when: false
      when: ct_status.rc == 0

    # Nesting is required for nsncd (mount namespaces).
    - name: Enable nesting feature
      ansible.builtin.command: pct set {{ nixos_ct_id }} -features nesting=1
      when:
        - ct_status.rc == 0
        - "'nesting=1' not in ct_config.stdout"
      changed_when: true
      notify: Reboot NixOS container

    # Tailscale (subnet router) needs /dev/net/tun. `pct set -dev0` is the
    # supported Proxmox 8.1+ method and survives Proxmox UI edits cleanly, but it
    # validates the device on the *host* — and /dev/net/tun only appears once the
    # `tun` kernel module is loaded — so load+persist it on the host first.
    - name: Pass through the TUN device for Tailscale
      block:
        - name: Ensure the tun kernel module loads on boot (Proxmox host)
          ansible.builtin.copy:
            dest: /etc/modules-load.d/tun.conf
            content: "tun\n"
            owner: root
            group: root
            mode: "0644"

        - name: Load the tun kernel module now (Proxmox host)
          ansible.builtin.command: modprobe tun
          changed_when: false

        - name: Pass through the TUN device into the container
          ansible.builtin.command: pct set {{ nixos_ct_id }} -dev0 /dev/net/tun
          when:
            - ct_status.rc == 0
            - "'dev0' not in ct_config.stdout"
          changed_when: true
          notify: Reboot NixOS container

    - name: Add bind mount for media directory
      ansible.builtin.command: >
        pct set {{ nixos_ct_id }} -mp0 /mnt/media,mp=/mnt/media
      when:
        - ct_status.rc == 0
        - "'mp0' not in ct_config.stdout"
      changed_when: true

    - name: Add bind mount for USB HDD
      ansible.builtin.command: >
        pct set {{ nixos_ct_id }} -mp1 /mnt/usb-hdd,mp=/mnt/usb-hdd
      when:
        - ct_status.rc == 0
        - "'mp1' not in ct_config.stdout"
      changed_when: true

  handlers:
    - name: Reboot NixOS container
      ansible.builtin.command: pct reboot {{ nixos_ct_id }}
      changed_when: true
