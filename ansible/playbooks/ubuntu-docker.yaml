---
- name: Configure an Ubuntu cloud image VM with Docker, Arcane and Dozzle
  hosts: ubuntu-vm
  remote_user: murtadha

  tasks:
    - name: Ensure /etc/apt/keyrings exists
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG apt key
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Get architecture
      changed_when: false
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: arch

    - name: Add Docker apt repository
      become: true
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['lsb']['codename'] }}"
        components: stable
        architectures: "{{ arch.stdout }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true

    - name: Install Docker packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker  # Docker SDK for Python, used by community.docker modules
        state: present

    - name: Add the user to the docker group
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups:
          - docker
        append: true

    - name: Set logging limits to avoid exhausting disk space
      become: true
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: '0644'
        content: |
          {
            "log-driver": "local",
            "log-opts": {
              "max-size": "100m",
              "max-file": "5"
            }
          }
      notify: Restart Docker

    - name: Create Arcane config directory
      become: true
      ansible.builtin.file:
        path: /opt/arcane
        state: directory
        mode: '0755'

    # Compose projects live here; mounted at the same path inside the
    # container so bind mounts in project files resolve on the host.
    # Owned by the PUID/PGID user: Arcane's root startup phase chowns only
    # /app/data and /builds to PUID:PGID before dropping privileges, so an
    # external projects dir must be chowned here.
    - name: Create Arcane projects directory
      become: true
      ansible.builtin.file:
        path: /opt/arcane/projects
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_id'] }}"
        mode: '0750'

    - name: Generate Arcane secrets
      become: true
      ansible.builtin.shell:
        cmd: |
          umask 077
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > /opt/arcane/arcane.env
        creates: /opt/arcane/arcane.env

    - name: Create Arcane data volume
      become: true
      community.docker.docker_volume:
        name: arcane_data

    # Default credentials are `arcane` and `arcane-admin` (change after first login)
    - name: Run Arcane
      become: true
      community.docker.docker_container:
        name: arcane
        image: ghcr.io/getarcaneapp/manager:v2.10.2
        restart_policy: always
        # Host cgroup namespace lets Arcane reliably detect its own container ID (for self-upgrades)
        cgroupns_mode: host
        published_ports:
          - "{{ ansible_host }}:3552:3552"
        env_file: /opt/arcane/arcane.env
        env:
          APP_URL: https://arcane.home.murtadha.dev
          # Caddy on nixos-ct terminates TLS; trust its X-Forwarded-* headers
          TRUSTED_PROXIES: 10.20.30.50/32
          PROJECTS_DIRECTORY: /opt/arcane/projects
          # Arcane starts as root for startup preparation, then drops to a non-root runtime user by default.
          # We set PUID and PGID so that Arcane-created files use a specific host UID/GID instead of the
          # built-in non-root user (65532:65532).
          PUID: "1000"
          PGID: "1000"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - arcane_data:/app/data
          - /opt/arcane/projects:/opt/arcane/projects

    # A bind mount rather than a named volume so the user database below can be
    # written from the host. Dozzle runs as root in-container, so it reads the
    # directory regardless of the host ownership that lets us write it.
    - name: Create Dozzle data directory
      become: true
      ansible.builtin.file:
        path: /opt/dozzle/data
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_id'] }}"
        mode: '0750'

    - name: Check for the Dozzle user database
      ansible.builtin.stat:
        path: /opt/dozzle/data/users.yml
      register: dozzle_users

    # Dozzle has no sign-up flow: under `simple` auth it exits at startup when
    # the user database is missing. Skip rather than fail so the rest of the
    # post-config run still completes.
    - name: Explain a missing Dozzle user database
      when: not dozzle_users.stat.exists
      ansible.builtin.debug:
        msg: >-
          Skipping Dozzle: /opt/dozzle/data/users.yml is missing. Create it on the VM with
          `read -rsp 'Password: ' p && docker run -i --rm amir20/dozzle generate
          murtadha --name murtadha > /opt/dozzle/data/users.yml <<<$p`
          and re-run this playbook.

    - name: Run Dozzle
      when: dozzle_users.stat.exists
      become: true
      community.docker.docker_container:
        name: dozzle
        image: amir20/dozzle:v10.7.5
        restart_policy: always
        published_ports:
          - "{{ ansible_host }}:8080:8080"
        env:
          DOZZLE_AUTH_PROVIDER: simple
          DOZZLE_HOSTNAME: "{{ inventory_hostname }}"
          DOZZLE_ENABLE_ACTIONS: "true"
          DOZZLE_NO_ANALYTICS: "true"
          DOZZLE_ENABLE_SHELL: "true"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /opt/dozzle/data:/data

  handlers:
    - name: Restart Docker
      become: true
      loop:
        - docker.service
        - containerd.service
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
