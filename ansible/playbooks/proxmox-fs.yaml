---
- name: Setup filesystem mounts on Proxmox host
  hosts: pve-host-1
  remote_user: root

  vars:
    mounts:
      # NOTE: btrfs on an LVM LV created manually by the Proxmox installer (the 'pve' VG, shared
      # with root + swap) — that stack is partially out of this playbook's scope/ownership,
      # so unlike the bulk SSD below there is intentionally no filesystem-creation task for it.
      - path: /mnt/media
        src: /dev/pve/media
        fstype: btrfs
        opts: compress=zstd,noatime
        dump: "0"
        passno: "2"
      - path: /mnt/bulk
        src: LABEL=bulk
        fstype: btrfs
        opts: compress=zstd,noatime,nofail
        dump: "0"
        passno: "2"
      - path: /mnt/usb-hdd
        src: UUID=A2DCFB36DCFB0379
        fstype: ntfs-3g
        opts: defaults,nofail,noatime,permissions,uid=1000,gid=1000,fmask=0117,dmask=0027
        dump: "0"
        passno: "0"

  tasks:
    - name: Install NTFS support (for external USB 3.5" HDD)
      ansible.builtin.apt:
        name: ntfs-3g
        state: present

    # Idempotent and safe with force=false (default)
    - name: Create the btrfs filesystem on the new bulk SSD
      community.general.filesystem:
        dev: /dev/disk/by-id/ata-CT1000BX500SSD1_2539E9CB547C
        fstype: btrfs
        opts: -L bulk

    - name: Mount filesystems and add to fstab
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        dump: "{{ item.dump }}"
        passno: "{{ item.passno }}"
        state: mounted
      loop: "{{ mounts }}"

    # Runs AFTER the mount so it targets the mounted btrfs root (mkfs leaves it root-owned),
    # not the shadowed underlying mountpoint.
    - name: Ensure ownership/permissions on the btrfs mount roots
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: murtadha
        group: murtadha
        mode: "0750"
      # The ntfs disk is excluded on purpose: its ownership is projected from the
      # uid=/gid=/dmask mount options, so a chown here would be redundant.
      loop: "{{ mounts | selectattr('fstype', 'equalto', 'btrfs') | list }}"

    - name: Create 'To Stream' directory with nocow attribute (avoids btrfs CoW fragmentation for torrent downloads)
      block:
        - name: Create the directory
          ansible.builtin.file:
            path: /mnt/bulk/To Stream
            state: directory
            mode: "0750"
            owner: murtadha
            group: murtadha
        # +C must be set on the empty directory before any files land so they inherit nodatacow
        - name: Disable copy-on-write
          ansible.builtin.command:
            cmd: chattr +C "/mnt/bulk/To Stream"
          changed_when: false

    - name: Make changes on the Proxmox storage side
      delegate_to: localhost # these modules make API calls to the Proxmox API *from* the controller
      module_defaults:
        group/community.proxmox.proxmox:
          api_host: "{{ proxmox_api.host }}"
          api_port: "{{ proxmox_api.port }}"
          api_user: "{{ proxmox_api.user }}"
          api_token_id: "{{ proxmox_api.token_id }}"
          api_token_secret: "{{ proxmox_api.token_secret }}"
          validate_certs: "{{ proxmox_api.validate_certs }}"
      block:
        - name: Enable all content types for 'local' storage
          community.proxmox.proxmox_storage:
            name: local
            type: dir
            dir_options:
              path: /var/lib/vz
            nodes: ["prox"]
            content:
              - vztmpl
              - backup
              - iso
              - snippets
              - import
              - images
              - rootdir
            state: present
        - name: Add the mounted directories to Proxmox storage
          community.proxmox.proxmox_storage:
            name: "{{ item.name }}"
            type: dir
            dir_options:
              path: "{{ item.path }}"
            nodes: ["prox"]
            content:
              - backup
              - images
            state: present
          loop:
            - { name: media-lv, path: /mnt/media/proxmox }
            # - { name: usb-hdd, path: /mnt/usb-hdd }

    - name: Setup monthly btrfs scrub for the btrfs filesystems
      vars:
        btrfs_scrub_mounts:
          - /mnt/media
          - /mnt/bulk
      block:
        - name: Create the scrub service units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/btrfs-scrub-{{ item | basename }}.service"
            mode: "0644"
            content: |
              [Unit]
              Description=Btrfs scrub on {{ item }}
              ConditionPathIsMountPoint={{ item }}

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/btrfs scrub start -B {{ item }}
              IOSchedulingClass=idle
              CPUSchedulingPolicy=idle
              Nice=19
          loop: "{{ btrfs_scrub_mounts }}"
        - name: Create the scrub timer units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/btrfs-scrub-{{ item | basename }}.timer"
            mode: "0644"
            content: |
              [Unit]
              Description=Monthly btrfs scrub on {{ item }}

              [Timer]
              OnCalendar=monthly
              Persistent=true
              RandomizedDelaySec=1h

              [Install]
              WantedBy=timers.target
          loop: "{{ btrfs_scrub_mounts }}"
        - name: Enable and start the scrub timers
          ansible.builtin.systemd:
            name: "btrfs-scrub-{{ item | basename }}.timer"
            enabled: true
            state: started
            daemon_reload: true
          loop: "{{ btrfs_scrub_mounts }}"
