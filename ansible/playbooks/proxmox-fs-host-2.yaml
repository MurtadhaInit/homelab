---
# sdb (the spare 120GB disk): formatted as an LVM-thin pool instead of btrfs 'dir' storage for
# thin provisioning, fast snapshots, and real block devices for VMs, while avoiding CoW
# fragmentation for VM images.
#
# sda (the primary, 250GB Crucial MX500 disk): holds the PVE installer-created btrfs root, and
# hence it's out of Ansible's scope (much like 'pve' VG on the first PVE node) — except for the
# swapfile, which a btrfs-root install leaves out entirely.
- name: Setup storage on the second Proxmox node
  hosts: pve-host-2 # hostname/node name: 'prox2'
  remote_user: root

  tasks:
    - name: Create the volume group on the dedicated disk
      community.general.lvg:
        vg: vmdata
        pvs: /dev/disk/by-id/ata-Samsung_SSD_850_EVO_120GB_S21MNWAFB211012

    # shrink=false keeps this idempotent: on re-runs the VG has no free space left, so
    # '100%FREE' resolves to 0 and lvol would otherwise treat it as a shrink request.
    - name: Create the thin pool (consumes all free space in the VG)
      community.general.lvol:
        vg: vmdata
        thinpool: vmdata
        size: 100%FREE
        shrink: false

    # community.proxmox.proxmox_storage has no 'lvmthin' type (only cephfs, cifs, dir,
    # iscsi, nfs, pbs, rbd and zfspool), so registering storage imperatively on the node.
    - name: Read the current Proxmox storage configuration
      ansible.builtin.slurp:
        src: /etc/pve/storage.cfg
      register: storage_cfg

    # 'rootdir' allows LXC rootfs volumes, 'images' allows VM disks
    - name: Register the thin pool as Proxmox storage
      ansible.builtin.command: >-
        pvesm add lvmthin local-lvmthin
        --vgname vmdata
        --thinpool vmdata
        --content rootdir,images
        --nodes prox2
      when: '"lvmthin: local-lvmthin" not in (storage_cfg.content | b64decode)'
      changed_when: true

    # The PVE installer creates the btrfs root storage without the 'snippets' content
    # type (for cloud-init snippets). We add it to enable all content types on local_btrfs.
    # Imperative on the node for the same reason as the thin pool above: proxmox_storage
    # has no 'btrfs' type either, and `type` is required for state=present.
    - name: Read the content types on the btrfs root storage
      ansible.builtin.command: pvesh get /storage/local-btrfs --output-format json
      register: local_btrfs_storage
      changed_when: false

    # `--content` replaces the list rather than appending to it, so we declare all types.
    - name: Enable all content types on the btrfs root storage
      ansible.builtin.command: >-
        pvesm set local-btrfs
        --content vztmpl,backup,iso,snippets,import,images,rootdir
      when: "'snippets' not in (local_btrfs_storage.stdout | from_json).content"
      changed_when: true

    # Without swap the kernel's only answer to memory pressure is the OOM killer,
    # which targets the largest RSS on the box (i.e. a guest). This is a cushion for
    # cold pages, not capacity: paging out a running VM is far worse than losing cache,
    # hence the low swappiness. `mkswapfile` is required on btrfs, since a swapfile
    # can't live on CoW or compressed extents (the root is mounted `compress=zstd`).
    #
    # The installer can pick a RAID0 data profile even on a single disk, which the
    # kernel refuses to swap on ("swapfile must have single data profile"). Convert
    # before creating the file; an existing swapfile has to go first, since its
    # extents are allocated under the old profile.
    - name: Read the data profile of the btrfs root
      ansible.builtin.command: btrfs filesystem df /
      register: btrfs_root_df
      changed_when: false

    - name: Convert the btrfs root to a single data profile
      when: "'Data, single:' not in btrfs_root_df.stdout"
      block:
        - name: Remove any swapfile allocated under the old profile
          ansible.builtin.file:
            path: /swapfile
            state: absent

        - name: Rewrite the data chunks as single
          ansible.builtin.command: btrfs balance start -dconvert=single /
          changed_when: true

    - name: Create the swapfile on the btrfs root
      ansible.builtin.command: btrfs filesystem mkswapfile --size 8g /swapfile
      args:
        creates: /swapfile

    - name: Register the swapfile in fstab
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Read the currently active swap areas
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false

    - name: Enable the swapfile
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in active_swaps.stdout"
      changed_when: true

    - name: Keep swap as a cushion rather than a regular memory tier
      ansible.posix.sysctl:
        name: vm.swappiness
        value: '10'
        sysctl_file: /etc/sysctl.d/99-swappiness.conf
        sysctl_set: true
        state: present
        reload: true
