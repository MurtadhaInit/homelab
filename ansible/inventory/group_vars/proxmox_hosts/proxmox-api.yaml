---
# API credentials used in Proxmox community modules.
#
# These hosts are standalone (not a Proxmox cluster), so each node has its own
# root@pam!automation token. The non-secret shape is shared here; the per-node
# secret lives in host_vars/<host>/proxmox-api-token.yaml.
proxmox_api:
  host: "{{ ansible_host }}"
  validate_certs: false
  port: 8006
  user: "root@pam"
  token_id: automation
  # Generate on each node with: pveum user token add root@pam automation --privsep 0
  token_secret: "{{ proxmox_api_token_secret }}"
