# ansible-galaxy collection install --upgrade -r ./requirements.yml
collections:
  # https://docs.ansible.com/ansible/latest/collections/ansible/posix/
  - name: ansible.posix
    version: "2.1.0"
  # https://docs.ansible.com/ansible/latest/collections/community/general/
  - name: community.general
    version: "13.0.1"
  # https://docs.ansible.com/ansible/latest/collections/community/sops/
  # Provides the `community.sops.sops` vars plugin that decrypts *.sops.yaml in
  # host_vars/group_vars (the per-host Proxmox API token). Needs the `sops` binary.
  - name: community.sops
    version: "2.4.0"
  # https://docs.ansible.com/projects/ansible/latest/collections/community/proxmox/index.html
  - name: community.proxmox
    version: "2.0.0-beta1"
  # https://prometheus-community.github.io/ansible/branch/main/
  # TODO: also requires: brew install gnu-tar
  - name: prometheus.prometheus
    version: "0.29.1"
  # https://docs.ansible.com/ansible/latest/collections/community/docker/
  - name: community.docker
    version: "5.2.0"
